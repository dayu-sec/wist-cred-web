name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 先在干净环境里跑一次构建：镜像里能出来的东西，CI 也要先能出来。
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

  # 2. 构建并推送多架构镜像（ghcr.io）。静态站点不需要预编译二进制，
  #    node/nginx 基础镜像本身就是多架构的，直接 cross-build 即可。
  docker:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：要启用就把下面几段打开，并配好
      # Variables：TCR_REGISTRY、TCR_PROJECT；Secrets：TCR_USERNAME / TCR_PASSWORD。
      #
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ${{ vars.TCR_REGISTRY }}
      #     username: ${{ secrets.TCR_USERNAME }}
      #     password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag 只推该 tag，不覆盖 :latest（理由同 wist-cred）。
          ghcr="ghcr.io/${{ github.repository }}"
          tags="$(printf '%s:%s' "$ghcr" "${{ github.ref_name }}")"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "$ghcr:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  # 3. 发布页（没有二进制附件，只留一页可追溯的版本说明）
  release:
    needs: [docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
