name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  # 1. 发版前先校验：构建必须过才发镜像。
  #
  #    为什么要在这里再做一次：ci.yml 的 push 过滤是 `branches`，**tag 推送不会触发它**，
  #    所以不加这一步，镜像可以在完全未经校验的情况下发布。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # 2a/2b. 原生分架构构建镜像，**不用 QEMU**（同 `wist-center`）：
  #   amd64 → ubuntu-24.04，arm64 → ubuntu-24.04-arm。
  #   之前用 `platforms: linux/amd64,linux/arm64` 一次构建时，arm64 那一段在 amd64 runner
  #   上模拟执行，镜像里的 `npm ci` 要跑二十多分钟。改原生后每个架构各跑一次本机构建。
  #
  #   **本工作流只推 ghcr**：TCR 在腾讯云，从 GitHub runner 上传经常要 8~10 分钟，
  #   把它留在这里会把「tag → 可用镜像」拖长一个数量级。TCR 同步在 `release-tcr.yml`
  #   里独立跑（同一个 tag 触发，单独一个 run，失败可以单独重跑，不阻塞发版）。
  docker-amd64:
    name: Docker image (linux/amd64)
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=cred-web-amd64
          cache-to: type=gha,mode=max,scope=cred-web-amd64

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          [ -n "${ghcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-arm64:
    name: Docker image (linux/arm64)
    needs: [verify]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=cred-web-arm64
          cache-to: type=gha,mode=max,scope=cred-web-arm64

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          [ -n "${ghcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 2c. 合并两个架构的 digest → 多架构 manifest（只写 manifest，不搬层）。
  docker-manifest:
    name: Compose multi-arch manifest
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.6.1-alpha / -beta / -rc …）只推该 tag，**不覆盖 :latest**。
          # 否则 :latest 会指向预发布产物，而 wist-cred-stack 是按固定 tag 拉镜像的。
          ghcr="ghcr.io/${{ github.repository }}"
          ghcr_tags="${ghcr}:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*) ;;
            *) ghcr_tags="$(printf '%s\n%s' "$ghcr_tags" "$ghcr:latest")" ;;
          esac
          printf 'ghcr_tags<<__EOF__\n%s\n__EOF__\n' "$ghcr_tags" >> "$GITHUB_OUTPUT"

      - name: Verify per-arch digests
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository }}"
          for f in /tmp/digests/ghcr-*; do
            docker buildx imagetools inspect "${ghcr}@sha256:$(cat "$f")" > /dev/null
          done
          [ "$(find /tmp/digests -name 'ghcr-*' | wc -l | tr -d ' ')" -eq 2 ] || { echo "::error::期望 2 个 ghcr digest"; exit 1; }

      - name: Create ghcr multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.ghcr_tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for f in /tmp/digests/ghcr-*; do
            sources+=("ghcr.io/${{ github.repository }}@sha256:$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

# 本工作流只出 ghcr 镜像（约 2 分钟）。
# TCR 是可选镜像源（国内站点用），由 `release-tcr.yml` 在同一 tag 上独立跑。
# 构建契约由仓库根 Dockerfile 满足：ARG APP_VERSION → ENV VITE_APP_VERSION；
# 本仓交付物就是镜像，因此没有单独的 GitHub Release job（与 wist-center-web 一致）。
